name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Load packaged Action without installing dependencies
        if: github.event_name == 'push' || github.event.pull_request.draft
        uses: ./
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Ensure committed action output matches TypeScript
        run: |
          git diff --exit-code -- dist
          if [ -n "$(git ls-files --others -- dist)" ]; then
            echo "::error::Generated dist files are missing from this commit."
            exit 1
          fi
